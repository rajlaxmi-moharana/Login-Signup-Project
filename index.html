<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="Login.css" />
  </head>
  <body>
    <main class="container">
      <!-- || Left panel -->
      <div class="left_panel">
        <img
          src="Images/Lock.png"
          alt="Lock image"
          class="lock_img"
          height="267"
          width="400"
        />
        <h1 class="left_panel__title">Welcome Back</h1>
        <p class="left_panel__description">
          Login to continue and explore amazing features
        </p>
      </div>

      <!-- || Right panel -->
      <div class="right_panel">
        <h1 class="right_panel__heading">Login</h1>
        <p class="right_panel__description">
          Welcome Back ! Please login to your account
        </p>

        <!-- || form  -->
        <form>
          <div class="form__flex">
            <div>
              <h2 class="form__heading">Email</h2>
              <input class="Email" type="text" placeholder="Enter your email" />
            </div>
            <div>
              <h2 class="form__heading form__heading--password">Password</h2>
              <input
                class="password"
                type="text"
                placeholder="Enter your password"
              />
            </div>
          </div>
        </form>

        <!-- || Checkbox part -->
        <div class="checkbox">
          <label class="remember">
            <input type="checkbox" /> <span class="nowrap">Remember me</span>
          </label>

          <a href="#"><h2>Forgot password ?</h2></a>
        </div>

        <!-- || Login button  -->
        <button href="#" type="button" class="login" style="text-align: center">
          Login
        </button>

        <!-- <div class="button-container">
          <button class="login">Login</button>
        </div> -->

        <!-- || option text part  -->
        <h2 class="text">or Continue with</h2>

        <!-- || options  -->
        <div class="option">
          <div class="option__Google">
            <img
              src="Images/google image.jpeg"
              alt="Google"
              height="20"
              width="20"
            />
            <a href="https://www.google.com/">Google</a>
          </div>

          <div class="option__Github">
            <img src="Images/github.jpeg" alt="Github" width="20" height="20" />
            <a href="https://github.com/">Github</a>
          </div>
        </div>

        <!-- || Footer  -->
        <footer>
          <h2>Don't have an account? <a href="signup.html">Sign up</a></h2>
        </footer>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
